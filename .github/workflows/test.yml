name: Personal edition tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --omit=peer --no-audit --no-fund
      - run: npm test
      - run: npm run check:installer
      - run: node install-arxiv-daily.cjs --prepare-only --dir prepared
